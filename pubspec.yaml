name: delta
description: Delta — личные финансы, слепки остатков.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.1.0
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  decimal: 3.2.6
  drift: 2.35.4
  sqlite3: 3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.3
  build_runner: 2.17.1

# SQLCipher для Android, Windows и тестов Linux вместо обычной SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
