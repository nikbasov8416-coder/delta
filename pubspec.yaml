name: delta
description: Delta — личные финансы, слепки остатков.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.1.0
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  decimal: 3.2.6
  drift: 2.35.4
  sqlite3: 3.9.1
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2
  cryptography: 2.9.0
  path_provider: 2.1.6
  uuid: 4.6.0
  xml: 7.1.0
  fl_chart: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.3
  build_runner: 2.17.1

# SQLCipher для Android, Windows и тестов Linux вместо обычной SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/certificates/harica_tls_rsa_root_ca_2021.crt
