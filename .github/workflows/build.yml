name: Проверка и сборки Delta

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

jobs:
  checks:
    name: Анализ и тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Генерация соответствует исходникам
        run: git diff --exit-code -- lib/data/database/app_database.g.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub --fatal-infos
      - run: flutter test --no-pub --reporter expanded
      - run: python3 -m unittest discover -s tool -p "test_*.py"

  android:
    name: Android signed APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Android SDK берётся с runner GitHub; на личный сервер не ставится.
      - name: Проверить секреты и подготовить постоянную подпись
        env:
          DELTA_ANDROID_KEYSTORE_BASE64: ${{ secrets.DELTA_ANDROID_KEYSTORE_BASE64 }}
          DELTA_ANDROID_STORE_PASSWORD: ${{ secrets.DELTA_ANDROID_STORE_PASSWORD }}
          DELTA_ANDROID_KEY_ALIAS: ${{ secrets.DELTA_ANDROID_KEY_ALIAS }}
          DELTA_ANDROID_KEY_PASSWORD: ${{ secrets.DELTA_ANDROID_KEY_PASSWORD }}
          DELTA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/delta-signing.jks
        run: python3 tool/prepare_android_signing.py
      - name: Собрать APK постоянным ключом
        env:
          DELTA_ANDROID_STORE_PASSWORD: ${{ secrets.DELTA_ANDROID_STORE_PASSWORD }}
          DELTA_ANDROID_KEY_ALIAS: ${{ secrets.DELTA_ANDROID_KEY_ALIAS }}
          DELTA_ANDROID_KEY_PASSWORD: ${{ secrets.DELTA_ANDROID_KEY_PASSWORD }}
          DELTA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/delta-signing.jks
        run: flutter build apk --release --no-pub --build-number=${{ github.run_number }}
      - name: Удалить временный keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/delta-signing.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Delta-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 ZIP
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub --reporter expanded
      - run: flutter build windows --release --no-pub
      - name: Упаковать весь комплект EXE, DLL и данных
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Delta-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Delta-windows-x64
          path: Delta-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
